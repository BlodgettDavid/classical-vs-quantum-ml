datasets:
  breast_cancer:
    dataset_name: "breast_cancer"
    split_ratio: 0.3
    random_state: 42
    scale_data: true
    pca_components: [2, 4]
    
    # Execution & simulation backends
    backend_config:
      type: "statevector"       # Options: "statevector", "aer_simulator"
      shots: null               # Null for exact statevector math
    
    # Model parameters
    svm_params:
      c_val: 1.0
      class_weight: "balanced"  # <-- FIX 1: Prevents majority class collapse (TN=0)

    # Quantum feature maps to benchmark
    quantum_params:
      feature_maps:
        - name: "ZZFeatureMap"
          reps: 1               # <-- FIX 2: Reduced reps to prevent phase over-rotation
          entanglement: "full"
        - name: "PauliFeatureMap"
          reps: 1               # <-- FIX 2: Lower circuit depth (depth ~5 instead of ~10/31)
          entanglement: "linear"
          paulis: ["Z", "ZZ"]

    # Visualization settings
    visualization:
      plot_decision_boundary: true
      grid_steps: 25
      output_dir: "plots"

  parity4d:
    dataset: "parity4d_stressed"
    split_ratio: 0.125          # Reduced test split from 0.25 to 0.125 (gives more training data)
    random_state: 42
    scale_data: true

    backend_config:
      type: "statevector"
      shots: null

    svm_params:
      C: 0.1                    # Adjusted to C=0.1 to widen SVM margins and prevent SV saturation

    quantum_params:
      feature_maps:
        - name: "ZZFeatureMap"
          reps: 1
          entanglement: "full"
        - name: "PauliFeatureMap"
          reps: 1
          entanglement: "linear"
          paulis: ["Z", "ZZ", "ZZZZ"]

  wine_top6:
    dataset_name: "wine_top6"
    split_ratio: 0.3
    random_state: 42
    scale_data: true
    pca_components: [0, 2]       # 0 = 6 qubits direct encoding, 2 = 2 qubits with PCA
    
    # Execution & simulation backends
    backend_config:
      type: "statevector"
      shots: null
    
    # Model parameters
    svm_params:
      c_val: 1.0

    # Quantum feature maps to benchmark
    quantum_params:
      feature_maps:
        - name: "ZZFeatureMap"
          reps: 2
          entanglement: "linear"
        - name: "PauliFeatureMap"
          reps: 2
          entanglement: "linear"
          paulis: ["Z", "ZZ"]

    # Visualization toggles
    visualization:
      plot_decision_boundary: true
      grid_steps: 15
      max_pca_dims_for_plot: 2